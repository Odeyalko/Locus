<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locus — адресное хранение</title>
<meta name="description" content="Адресное хранение ПВЗ: стройте склад, отмечайте ячейки и передавайте смене одним файлом.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --black:#000;--white:#fff;--gray:#969696;--gray-light:#ededed;--orange:#f93c00;--green:#d9fcab;
  --bg:#fff;--fg:#000;--panel:#fff;--line:#ededed;--line-strong:#b0b0b0;--muted:#6b6b6b;
  --canvas:#f5f5f5;--dot:#d2d2d2;
  --btn-bg:#000;--btn-fg:#fff;
  --cell:#fff;--cell-line:#b9b9b9;--tag:#ededed;--frame:#868b91;--head:#000;
  --done-bg:#d9fcab;--done-line:#5f9f14;--done-fg:#2b5700;
  --warn-bg:#ffd8cb;--warn-line:#f93c00;--warn-fg:#9c2400;
  --font-display:"Times New Roman",Times,serif;--font-body:Arial,Helvetica,sans-serif;--radius:2px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b;--fg:#f2f2f2;--panel:#151515;--line:#2a2a2a;--line-strong:#4b4b4b;--muted:#a0a0a0;
    --canvas:#101010;--dot:#2a2a2a;--btn-bg:#f2f2f2;--btn-fg:#000;
    --cell:#1d1d1d;--cell-line:#4b4b4b;--tag:#262626;--frame:#5c6369;--head:#2a2a2a;
    --done-bg:#2d4b12;--done-line:#8fd13a;--done-fg:#d9fcab;
    --warn-bg:#4d1b0d;--warn-line:#ff6a3d;--warn-fg:#ffc3b0;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0b;--fg:#f2f2f2;--panel:#151515;--line:#2a2a2a;--line-strong:#4b4b4b;--muted:#a0a0a0;
  --canvas:#101010;--dot:#2a2a2a;--btn-bg:#f2f2f2;--btn-fg:#000;
  --cell:#1d1d1d;--cell-line:#4b4b4b;--tag:#262626;--frame:#5c6369;--head:#2a2a2a;
  --done-bg:#2d4b12;--done-line:#8fd13a;--done-fg:#d9fcab;
  --warn-bg:#4d1b0d;--warn-line:#ff6a3d;--warn-fg:#ffc3b0;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}

/* ───────── Topbar ───────── */
.topbar{flex:none;height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer}
.brand svg{height:17px;width:auto;display:block;color:var(--fg)}
.brand-name{font-family:var(--font-display);font-size:22px;letter-spacing:.01em}
.vsep{width:1px;height:20px;background:var(--line-strong);flex:none}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.crumbs button:hover{color:var(--orange)}
.crumbs .cur{color:var(--fg);font-weight:700;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.save-ind{font-size:12px;color:var(--muted);white-space:nowrap}
.save-ind.bad{color:var(--orange);font-weight:700}
.btn .short{display:none}

/* ───────── Buttons ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);border-radius:var(--radius);font-size:13px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.btn.primary:hover:not(:disabled){background:var(--orange);border-color:var(--orange);color:#fff}
.btn.danger{color:var(--orange);border-color:var(--orange)}
.btn.danger:hover:not(:disabled){background:var(--orange);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.menu-btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius);cursor:pointer;font-size:16px;line-height:1}
.icon-btn:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
.icon-btn:disabled{opacity:.35;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;flex:none}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;line-height:1}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--btn-bg);color:var(--btn-fg)}
.seg button:hover:not(.on){color:var(--orange)}

/* ───────── Home ───────── */
#home{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.home-hero{background:#000;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.home-hero h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(64px,10vw,124px);line-height:.92;letter-spacing:-.025em}
.home-hero p{margin:18px 0 0;max-width:420px;font-size:17px;color:rgba(255,255,255,.75)}
.demo{width:min(260px,70%);height:auto}
.demo .frame{fill:none;stroke:rgba(255,255,255,.55);stroke-width:3}
.demo .dc{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.35);stroke-width:1.5;animation:dc 7s ease-in-out infinite}
@keyframes dc{0%,18%{fill:rgba(255,255,255,.08)}26%,44%{fill:#d9fcab}54%,72%{fill:#f93c00}82%,100%{fill:rgba(255,255,255,.08)}}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.7)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:1px;vertical-align:-1px}
.home-menu{padding:56px;display:flex;flex-direction:column;gap:12px;align-content:start;max-width:600px}
.menu-btn{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 20px;border:1px solid var(--line-strong);background:var(--panel);color:var(--fg);border-radius:var(--radius);cursor:pointer;text-align:left;transition:border-color .2s,transform .2s,background .2s,color .2s}
.menu-btn strong{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.1}
.menu-btn small{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.menu-btn .arrow{font-size:20px;opacity:.6}
.menu-btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.menu-btn.primary small{color:inherit;opacity:.7}
.menu-btn:hover:not(:disabled){border-color:var(--orange);transform:translateY(-1px)}
.menu-btn.primary:hover:not(:disabled){background:var(--orange);color:#fff}
.menu-btn:disabled{opacity:.45;cursor:default}
.saved h2{margin:28px 0 8px;font-family:var(--font-display);font-weight:400;font-size:20px}
.saved-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.saved-row .meta{flex:1;min-width:0}
.saved-row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-row small{color:var(--muted);font-size:12px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--done-line);transition:width .3s}

/* ───────── Workspace ───────── */
#ws{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto auto minmax(0,1fr)}
.notebar{grid-column:1/-1;grid-row:1;display:flex;gap:12px;align-items:center;padding:8px 20px;background:var(--done-bg);color:var(--done-fg);border-bottom:1px solid var(--done-line);font-size:13px}
.notebar b{font-family:var(--font-display);font-weight:400;font-size:15px}
.notebar span{flex:1;min-width:0;white-space:pre-wrap}
.notebar button{background:none;border:0;cursor:pointer;font-size:18px;line-height:1}
.toolbar{grid-column:1/-1;grid-row:2;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.tb-grp{display:flex;align-items:center;gap:8px;flex:none}
.search input{width:150px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--panel);font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--orange);box-shadow:0 0 0 2px rgba(249,60,0,.15)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px;font-weight:700;background:var(--panel);flex:none}
.chip.ok{border-color:var(--done-line);color:var(--done-fg);background:var(--done-bg)}
.chip.warn{border-color:var(--warn-line);color:var(--warn-fg);background:var(--warn-bg);cursor:pointer}
.zoom-lbl{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
.panel-toggle{display:none}

.stage{grid-column:1;grid-row:3;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.6px);background-size:20px 20px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world.glide{transition:transform .38s ease}
.stage.dive .world{animation:dive .38s ease}
@keyframes dive{from{opacity:0;transform-origin:0 0}to{opacity:1}}
.empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;color:var(--muted);padding:24px}
.empty-hint div{max-width:340px}
.empty-hint b{display:block;font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--fg);margin-bottom:6px}

.inspector{grid-column:2;grid-row:3;min-height:0;border-left:1px solid var(--line);overflow:auto;padding:18px 18px 28px;background:var(--panel)}
.insp-sec{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.insp-sec:last-child{border-bottom:0;margin-bottom:0}
.insp-sec h3{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.15}
.insp-sec p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.insp-sec p.warn{color:var(--orange);font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.fld input,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--bg);font-size:14px;outline:none;color:var(--fg)}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--orange);box-shadow:0 0 0 2px rgba(249,60,0,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13px}
.frow>span{color:var(--muted);font-size:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.stepper button{width:32px;height:32px;border:0;background:var(--panel);cursor:pointer;font-size:16px;font-weight:700}
.stepper button:hover{color:var(--orange)}
.stepper b{min-width:36px;text-align:center;font-size:14px}
.shelf-row{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.shelf-row.on{border-color:var(--orange);box-shadow:0 0 0 2px rgba(249,60,0,.15)}
.shelf-row b{font-size:13px}
.shelf-row .seg button{padding:6px 8px}
.list-btn{display:flex;width:100%;justify-content:space-between;gap:10px;padding:9px 10px;margin-bottom:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);cursor:pointer;text-align:left;font-size:13px}
.list-btn:hover{border-color:var(--orange)}
.list-btn small{color:var(--muted)}
.list-btn.warnrow{border-left:4px solid var(--warn-line)}
.big{font-family:var(--font-display);font-size:44px;line-height:1}
.big small{font-family:var(--font-body);font-size:14px;color:var(--muted)}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line-strong);border-radius:2px;font-size:11px;font-weight:700;background:var(--bg)}
.legend-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend-inline i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--cell-line)}

/* ───────── Rooms ───────── */
.room{position:absolute;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--panel) 82%,transparent);border:2px solid var(--fg);border-radius:var(--radius)}
.room-n{font-family:var(--font-display);line-height:1;pointer-events:none}
.room-meta{position:absolute;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;pointer-events:none}
.room-meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--line);pointer-events:none}
.room-bar i{display:block;height:100%;background:var(--done-line)}
.room.sel{outline:3px solid var(--orange);outline-offset:3px}
.handle{position:absolute;width:14px;height:14px;background:var(--orange);border:2px solid #fff;border-radius:2px;z-index:3}
.handle[data-handle="n"]{left:calc(50% - 7px);top:-8px;cursor:ns-resize}.handle[data-handle="s"]{left:calc(50% - 7px);bottom:-8px;cursor:ns-resize}
.handle[data-handle="e"]{top:calc(50% - 7px);right:-8px;cursor:ew-resize}.handle[data-handle="w"]{top:calc(50% - 7px);left:-8px;cursor:ew-resize}
.handle[data-handle="ne"]{top:-8px;right:-8px;cursor:nesw-resize}.handle[data-handle="nw"]{top:-8px;left:-8px;cursor:nwse-resize}
.handle[data-handle="se"]{bottom:-8px;right:-8px;cursor:nwse-resize}.handle[data-handle="sw"]{bottom:-8px;left:-8px;cursor:nesw-resize}

/* ───────── Racks ───────── */
.rack{position:absolute;background:var(--panel);border:3px solid var(--frame);border-radius:var(--radius)}
.rack.sel{outline:3px solid var(--orange);outline-offset:4px}
.rack-head{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--head);color:#fff;font-size:12px}
.rack-num{font-family:var(--font-display);font-size:18px;letter-spacing:.02em}
.shelf{position:relative;height:60px;display:flex;border-bottom:5px solid var(--frame)}
.shelf.whole{align-items:center;justify-content:center;background:var(--cell);font-size:13px;font-weight:700;overflow:hidden}
.shelf.has-cells{background:var(--cell)}
.shelf.sel{box-shadow:inset 0 0 0 3px var(--orange)}
.shelf-tag{flex:none;width:44px;border:0;border-right:1px solid var(--cell-line);background:var(--tag);font-size:11px;font-weight:700;cursor:pointer;padding:0;position:relative}
.shelf-tag[data-bulk="1"]{background:var(--done-bg);color:var(--done-fg)}
.shelf-tag[data-bulk="2"]{background:var(--warn-bg);color:var(--warn-fg)}
.shelf-tag[data-bulk="p"]{box-shadow:inset 4px 0 0 var(--done-line)}
.cells{flex:1;display:flex;min-width:0}
.cell{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--cell-line);background:var(--cell);font-size:11px;font-weight:700;overflow:hidden}
.cell:last-child{border-right:0}
.cell[data-st="1"],.shelf.whole[data-st="1"]{background:var(--done-bg);color:var(--done-fg)}
.cell[data-st="2"],.shelf.whole[data-st="2"]{background:var(--warn-bg);color:var(--warn-fg)}
.cell[data-st="1"]::after,.shelf.whole[data-st="1"]::after{content:"✓";position:absolute;top:3px;right:6px;font-size:13px;color:var(--done-line)}
.cell[data-st="2"]::after,.shelf.whole[data-st="2"]::after{content:"!";position:absolute;top:2px;right:7px;font-size:14px;color:var(--warn-line)}
.mode-check .cell,.mode-check .shelf.whole,.mode-check .shelf-tag,.mode-check .box,.mode-check .room{cursor:pointer}
.mode-build .rack,.mode-build .box,.mode-build .room{cursor:move}
.mode-check .cell:hover,.mode-check .shelf.whole:hover{filter:brightness(.96)}

/* ───────── Boxes ───────── */
.box{position:absolute;width:104px;height:76px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;background:linear-gradient(#d3ad72,#c19657);border:2px solid #8a6a36;border-radius:2px}
.box::before{content:"";position:absolute;left:50%;top:0;width:18px;height:100%;transform:translateX(-50%);background:rgba(255,255,255,.26)}
.box-label{position:relative;z-index:1;min-width:58px;padding:3px 8px;background:#fff;color:#000;border:1px solid #666;font-size:12px;font-weight:700;text-align:center;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box[data-st="1"]{border-color:var(--done-line);box-shadow:0 0 0 3px var(--done-bg)}
.box[data-st="1"] .box-label{background:var(--done-bg);border-color:var(--done-line);color:var(--done-fg)}
.box[data-st="2"]{border-color:var(--warn-line);box-shadow:0 0 0 3px var(--warn-bg)}
.box[data-st="2"] .box-label{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-fg)}
.box[data-st="1"]::after,.box[data-st="2"]::after{position:absolute;top:2px;right:6px;z-index:2;font-size:14px;font-weight:700}
.box[data-st="1"]::after{content:"✓";color:var(--done-line)}
.box[data-st="2"]::after{content:"!";color:var(--warn-line)}
.box.sel{outline:3px solid var(--orange);outline-offset:4px}


/* ───────── Names, pockets, inline rename ───────── */
.lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.shelf-tag{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.shelf-row{flex-wrap:wrap}
.shelf-name{width:84px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);font-size:13px;font-weight:700;outline:none}
.shelf-name:focus,.cell-names input:focus{border-color:var(--orange);box-shadow:0 0 0 2px rgba(249,60,0,.15)}
.cell-names{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%;margin-top:8px}
.cell-names input{flex:1 1 70px;min-width:70px;padding:5px 7px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);font-size:12px;font-weight:700;outline:none}
.inline-edit{position:absolute;z-index:20;padding:0 10px;border:2px solid var(--orange);border-radius:2px;background:var(--panel);color:var(--fg);font:700 14px var(--font-body);text-align:center;outline:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.pockets{position:absolute;padding:28px 6px 6px;background:#80868d;border:2px solid #5d636a;border-radius:3px}
.pk-top{position:absolute;left:0;right:0;top:0;height:24px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid rgba(0,0,0,.2)}
.pk-label{max-width:90%;padding:1px 8px;background:#fff;color:#000;border:1px solid #555;font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-grid{display:grid;gap:6px;height:100%}
.pk-grid i{display:block;background:#b7bcc2;border:1px solid #5d636a;border-radius:2px 2px 9px 9px}
.pockets[data-st="1"]{border-color:var(--done-line);box-shadow:0 0 0 3px var(--done-bg)}
.pockets[data-st="1"] .pk-grid i{background:var(--done-bg);border-color:var(--done-line)}
.pockets[data-st="2"]{border-color:var(--warn-line);box-shadow:0 0 0 3px var(--warn-bg)}
.pockets[data-st="2"] .pk-grid i{background:var(--warn-bg);border-color:var(--warn-line)}
.pockets[data-st="1"]::after,.pockets[data-st="2"]::after{position:absolute;top:2px;right:7px;font-size:15px;font-weight:700;background:var(--panel);border-radius:50%;width:19px;height:19px;line-height:19px;text-align:center}
.pockets[data-st="1"]::after{content:"✓";color:var(--done-line)}
.pockets[data-st="2"]::after{content:"!";color:var(--warn-line)}
.pockets.sel{outline:3px solid var(--orange);outline-offset:4px}
.mode-check .pockets{cursor:pointer}
.mode-build .pockets{cursor:move}

/* animations */
.pop{animation:pop .32s ease;z-index:3}
.locate-ring{position:absolute;z-index:60;pointer-events:none;border:3px solid var(--orange);border-radius:5px;background:rgba(249,60,0,.12);
  animation:ring 1s ease-out 3,ringout .5s ease 3.4s forwards}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(249,60,0,.7)}100%{box-shadow:0 0 0 22px rgba(249,60,0,0)}}
@keyframes ringout{to{opacity:0}}
@keyframes pop{0%{transform:scale(.93)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

/* zoom/stage buttons overlay */
.stage-help{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--canvas) 85%,transparent);padding:3px 8px;border-radius:2px}

/* ───────── Toast / Modal ───────── */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);display:flex;align-items:center;gap:14px;background:#000;color:#fff;padding:11px 16px;border-radius:var(--radius);font-size:13px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:200;max-width:92vw;border:1px solid rgba(255,255,255,.2)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--green);font-weight:700;cursor:pointer;font-size:13px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:150}
.modal{width:min(560px,100%);max-height:90%;overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);padding:24px;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.1}
.modal .lead{margin:0 0 16px;color:var(--muted);font-size:13px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal textarea.json{width:100%;min-height:150px;padding:10px;border:1px solid var(--line-strong);background:var(--bg);border-radius:var(--radius);font:12px/1.4 monospace;resize:vertical}
.drop{display:block;padding:22px;border:2px dashed var(--line-strong);border-radius:var(--radius);text-align:center;color:var(--muted);cursor:pointer;margin-bottom:12px;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--orange);background:rgba(249,60,0,.05);color:var(--fg)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps .n{width:34px;height:34px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px}
.steps b{display:block}.steps span{font-size:13px;color:var(--muted)}
.sumline{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.sumline b{color:var(--fg)}

@media (max-width:860px){

  .crumbs{flex:1 1 0;min-width:0;overflow:hidden}.crumbs .cur{overflow:hidden;text-overflow:ellipsis}

  .inspector{grid-column:1;grid-row:4;border-left:0;border-top:1px solid var(--line);max-height:42vh}
  #ws.panel-closed .inspector{display:none}
  .panel-toggle{display:inline-flex}
  .search input{width:110px}
  .stage-help{display:none}
}

<script>
(function () {
'use strict';

/* ═════════════ Константы и утилиты ═════════════ */

/* ═════════════ Хранилище (локально в браузере) ═════════════ */
var mem = { spaces: {}, last: null, quick: { shelves: 5, cells: 3, qty: 1, w: 240, prows: 4, pcols: 4 } };
var saveFailed = false, saveTimer = null;

function loadStore() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var j = JSON.parse(raw);
    if (j && j.spaces) {
      Object.keys(j.spaces).forEach(function (id) {
        var sp = normalizeSpace(j.spaces[id]);
        if (sp) mem.spaces[sp.id] = sp;
      });
      mem.last = mem.spaces[j.last] ? j.last : null;
    }
    if (j && j.quick) mem.quick = Object.assign(mem.quick, j.quick);
  } catch (e) { /* пустое/битое хранилище — начинаем с нуля */ }
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(mem)); saveFailed = false; S.savedAt = Date.now(); }
  catch (e) { saveFailed = true; }
  updateSaveInd();
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 250); }
function updateSaveInd() {
  var el = $('#saveInd'); if (!el) return;
  if (saveFailed) { el.className = 'save-ind bad'; el.textContent = 'Не сохраняется в браузере — скачайте файл'; return; }
  el.className = 'save-ind';
  el.textContent = S.screen === 'home' || !S.savedAt ? '' : 'Сохранено локально · ' + new Date(S.savedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

/* ═════════════ Модель данных ═════════════ */
function newShelf(cells) { return cells ? { cells: cells, st: 0, cs: new Array(cells).fill(0), label: '', names: new Array(cells).fill('') } : { cells: 0, st: 0, cs: [], label: '', names: [] }; }
function newSpace(name) { return { id: uid(), name: name || 'Новое пространство', note: '', createdAt: Date.now(), updatedAt: Date.now(), roomSeq: 0, rooms: [] }; }
function stOf(v) { v = toNum(v); return v === 1 || v === 2 ? v : 0; }

function normalizeSpace(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.rooms)) return null;
  var sp = { id: String(raw.id || uid()).slice(0, 40), name: String(raw.name || 'Пространство').slice(0, 80), note: String(raw.note || '').slice(0, 2000),
    createdAt: toNum(raw.createdAt, Date.now()), updatedAt: toNum(raw.updatedAt, Date.now()), roomSeq: 0, rooms: [] };
  var maxN = 0, lab = function (v) { return String(v == null ? '' : v).slice(0, 24); };
  raw.rooms.slice(0, 60).forEach(function (r, ri) {
    if (!r || typeof r !== 'object') return;
    var n = Math.max(1, Math.round(toNum(r.n, ri + 1))); maxN = Math.max(maxN, n);
    var room = { id: String(r.id || uid()).slice(0, 40), n: n, name: String(r.name || '').slice(0, 60),
      x: snapTo(toNum(r.x), GRID), y: snapTo(toNum(r.y), GRID), w: Math.max(100, snapTo(toNum(r.w, 240), GRID)), h: Math.max(100, snapTo(toNum(r.h, 200), GRID)), racks: [], boxes: [], pockets: [] };
    (Array.isArray(r.racks) ? r.racks : []).slice(0, 300).forEach(function (k) {
      if (!k || typeof k !== 'object') return;
      var rack = { id: String(k.id || uid()).slice(0, 40), num: Math.max(1, Math.round(toNum(k.num, 1))), label: lab(k.label), sd: k.sd === 'u' ? 'u' : 'd', cd: k.cd === 'r' ? 'r' : 'l',
        x: snapTo(toNum(k.x), SNAP), y: snapTo(toNum(k.y), SNAP), w: clamp(snapTo(toNum(k.w, 240), GRID), 160, 420), shelves: [] };
      (Array.isArray(k.shelves) ? k.shelves : []).slice(0, 20).forEach(function (s) {
        s = s || {}; var c = Math.round(toNum(s.cells)); c = c >= 2 ? clamp(c, 2, 6) : 0;
        var sh = newShelf(c); sh.label = lab(s.label);
        if (c) { var src = Array.isArray(s.cs) ? s.cs : [], nm = Array.isArray(s.names) ? s.names : []; sh.cs = sh.cs.map(function (_, i) { return stOf(src[i]); }); sh.names = sh.names.map(function (_, i) { return lab(nm[i]); }); } else sh.st = stOf(s.st);
        rack.shelves.push(sh);
      });
      if (!rack.shelves.length) rack.shelves.push(newShelf(0));
      room.racks.push(rack);
    });
    (Array.isArray(r.boxes) ? r.boxes : []).slice(0, 300).forEach(function (b) {
      if (!b || typeof b !== 'object') return;
      room.boxes.push({ id: String(b.id || uid()).slice(0, 40), label: lab(b.label) || 'Короб', x: snapTo(toNum(b.x), SNAP), y: snapTo(toNum(b.y), SNAP), st: stOf(b.st) });
    });
    (Array.isArray(r.pockets) ? r.pockets : []).slice(0, 100).forEach(function (b) {
      if (!b || typeof b !== 'object') return;
      room.pockets.push({ id: String(b.id || uid()).slice(0, 40), label: lab(b.label) || 'Кармашки', x: snapTo(toNum(b.x), SNAP), y: snapTo(toNum(b.y), SNAP),
        rows: clamp(Math.round(toNum(b.rows, 4)), 1, 8), cols: clamp(Math.round(toNum(b.cols, 4)), 1, 8), st: stOf(b.st) });
    });
    sp.rooms.push(room);
  });
  sp.roomSeq = Math.max(maxN, Math.round(toNum(raw.roomSeq)));
  return sp;
}

function rackH(r) { return HEAD_H + r.shelves.length * SHELF_H + 6; }
function pocketW(p) { return p.cols * 40 + 10; }
function pocketH(p) { return p.rows * 52 + 28; }

/* Названия. По умолчанию подпись собирается из номеров (2-3-1) и каскадом
   следует за стеллажом и полкой, но любую подпись можно заменить вручную —
   чтобы на плане было ровно то, что написано на реальной наклейке. */
function rackLabel(r) { return r.label || String(r.num); }
function shelfNum(r, i) { return r.sd === 'u' ? r.shelves.length - i : i + 1; }
function cellNum(r, sh, j) { return r.cd === 'r' ? sh.cells - j : j + 1; }
function shelfDefault(r, i) { return rackLabel(r) + '-' + shelfNum(r, i); }
function shelfAddr(r, i) { return r.shelves[i].label || shelfDefault(r, i); }
function cellDefault(r, i, j) { return shelfAddr(r, i) + '-' + cellNum(r, r.shelves[i], j); }
function cellAddr(r, i, j) { var n = r.shelves[i].names; return (n && n[j]) || cellDefault(r, i, j); }
function hasCustomNames(r) { return r.shelves.some(function (sh) { return sh.label || (sh.names || []).some(Boolean); }); }

function unitsOf(sh) { return sh.cells ? sh.cs : [sh.st]; }
function tally(list) { var t = 0, d = 0, w = 0; list.forEach(function (v) { t++; if (v === 1) d++; else if (v === 2) w++; }); return { t: t, d: d, w: w }; }
function rackStats(r) { var a = []; r.shelves.forEach(function (sh) { a = a.concat(unitsOf(sh)); }); return tally(a); }
function roomStats(room) {
  var a = []; room.racks.forEach(function (r) { r.shelves.forEach(function (sh) { a = a.concat(unitsOf(sh)); }); });
  room.boxes.forEach(function (b) { a.push(b.st); }); room.pockets.forEach(function (p) { a.push(p.st); }); return tally(a);
}
function spaceStats(sp) { var s = { t: 0, d: 0, w: 0 }; sp.rooms.forEach(function (r) { var x = roomStats(r); s.t += x.t; s.d += x.d; s.w += x.w; }); return s; }
function nextRackNum(sp) { var m = 0; sp.rooms.forEach(function (r) { r.racks.forEach(function (k) { m = Math.max(m, k.num); }); }); return m + 1; }
function isDupNum(rack) { var c = 0, l = rackLabel(rack); S.space.rooms.forEach(function (r) { r.racks.forEach(function (k) { if (rackLabel(k) === l) c++; }); }); return c > 1; }
function shelfState(sh) { if (!sh.cells) return sh.st; if (sh.cs.some(function (v) { return v === 2; })) return 2; if (sh.cs.every(function (v) { return v === 1; })) return 1; return 0; }
function setCells(sh, n) {
  if (n === sh.cells) return;
  if (n === 0) { sh.st = shelfState(sh); sh.cells = 0; sh.cs = []; sh.names = []; return; }
  if (sh.cells) { var old = sh.cs, on = sh.names || []; sh.cs = Array.from({ length: n }, function (_, i) { return old[i] || 0; }); sh.names = Array.from({ length: n }, function (_, i) { return on[i] || ''; }); }
  else { sh.cs = new Array(n).fill(sh.st); sh.names = new Array(n).fill(''); }
  sh.cells = n; sh.st = 0;
}
function attention() {
  var out = [];
  S.space.rooms.forEach(function (room) {
    room.racks.forEach(function (r) { r.shelves.forEach(function (sh, i) {
      if (sh.cells) sh.cs.forEach(function (v, j) { if (v === 2) out.push({ room: room, addr: cellAddr(r, i, j), key: 'c:' + r.id + ':' + i + ':' + j }); });
      else if (sh.st === 2) out.push({ room: room, addr: shelfAddr(r, i), key: 's:' + r.id + ':' + i });
    }); });

}

function applyView() {

  stage.style.backgroundSize = (GRID * v.k) + 'px ' + (GRID * v.k) + 'px';
  stage.style.backgroundPosition = v.x + 'px ' + v.y + 'px';
  var z = $('#zoomLbl'); if (z) z.textContent = Math.round(v.k * 100) + '%';
}
function contentRects() {
  if (S.screen === 'space') return S.space.rooms.map(function (r) { return { x: r.x, y: r.y, w: r.w, h: r.h }; });

}

  var x0 = Math.min.apply(null, rs.map(function (r) { return r.x; })), y0 = Math.min.apply(null, rs.map(function (r) { return r.y; }));
  var x1 = Math.max.apply(null, rs.map(function (r) { return r.x + r.w; })), y1 = Math.max.apply(null, rs.map(function (r) { return r.y + r.h; }));

function revealSel() {
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {

      var el = world.querySelector(sel + '[data-id="' + S.sel.id + '"]'); if (!el) return;

      if (er.top < sr.top + m) dy = sr.top + m - er.top; else if (er.bottom > sr.bottom - m) dy = sr.bottom - m - er.bottom;

/* ═════════════ Действия: строительство ═════════════ */
function overlaps(a, b, pad) { pad = pad == null ? 16 : pad; return a.x < b.x + b.w + pad && a.x + a.w + pad > b.x && a.y < b.y + b.h + pad && a.y + a.h + pad > b.y; }

}

}

}

    var room = { id: uid(), n: sp.roomSeq, name: '', x: spot.x, y: spot.y, w: w, h: h, racks: [], boxes: [], pockets: [] };
    sp.rooms.push(room); S.sel = { type: 'room', id: room.id };

    case 'del-space': (function (id) { var sp = mem.spaces[id]; ask('Удалить «' + sp.name + '»?', 'Пространство удалится с этого устройства. Если нужна копия — сначала сохраните его в файл.', 'Удалить', true).then(function (ok) { if (!ok) return; delete mem.spaces[id]; if (mem.last === id) mem.last = null; persist(); render(); }); })(el.dataset.id); break;
    case 'nav-space': goSpace(); break;
    case 'close-note': S.noteVisible = false; renderNote(); break;
    case 'mode': closeRename(); S.mode = el.dataset.v; S.sel = null; render(); break;
    case 'add-room': addRoom(); break;
    case 'add-rack': addRacks(); break;
    case 'add-box': addBox(); break;
    case 'add-pocket': addPocket(); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'attn': nextAttention(); break;
    case 'zoom-in': zoomBy(1.2); break;
    case 'zoom-out': zoomBy(1 / 1.2); break;
    case 'fit': glide(); fitView(); break;
    case 'panel': S.panel = !S.panel; render(); break;
    case 'save-file': openExport(); break;
    case 'enter-room': enterRoom(el.dataset.id); break;
    case 'open-room': enterRoom(el.dataset.id); break;
    case 'sel-room': S.sel = { type: 'room', id: el.dataset.id }; render(); break;
    case 'goto': goTo(el.dataset.room, el.dataset.key); break;
    case 'reset-marks': ask('Сбросить все отметки?', 'Все зелёные и красные отметки в этом пространстве будут сняты. Структура склада останется.', 'Сбросить', true).then(function (ok) { if (ok) resetMarks(); }); break;
    case 'del-sel': deleteSel(); break;
    case 'dup': dupRack(); break;
    case 'dup-box': addBox(selBox()); break;
    case 'dup-pocket': addPocket(selPocket()); break;
    case 'dup-n': S.dupN = clamp(S.dupN + +el.dataset.d, 1, 30); renderInspector(); break;
    case 'q': var k = el.dataset.k, lim = { shelves: [1, 12], qty: [1, 30], w: [160, 420], prows: [1, 8], pcols: [1, 8] }[k]; mem.quick[k] = clamp(mem.quick[k] + +el.dataset.d, lim[0], lim[1]); scheduleSave(); renderInspector(); break;
    case 'pk': p = selPocket(); if (p) mutate(function () { p[el.dataset.k] = clamp(p[el.dataset.k] + +el.dataset.d, 1, 8); }); break;
    case 'shelf-add': r = selRack(); mutate(function () { var last = r.shelves[r.shelves.length - 1]; r.shelves.push(newShelf(last ? last.cells : 3)); }); break;
    case 'shelf-del': r = selRack(); if (r.shelves.length > 1) mutate(function () { r.shelves.pop(); if (S.sel.shelf >= r.shelves.length) S.sel.shelf = undefined; }); break;
    case 'rack-w': r = selRack(); mutate(function () { r.w = clamp(r.w + +el.dataset.d, 160, 420); }); break;
    case 'rack-dir': r = selRack(); mutate(function () { r[el.dataset.k] = el.dataset.v; }); break;
    case 'reset-names': r = selRack(); mutate(function () { r.shelves.forEach(function (sh) { sh.label = ''; sh.names = sh.names.map(function () { return ''; }); }); }); toast('Названия сброшены к нумерации по умолчанию', { text: 'Отменить', fn: undo }); break;
    case 'seg':
      var val = +el.dataset.val, scope = el.dataset.seg;
      if (scope === 'q') { mem.quick.cells = val; scheduleSave(); renderInspector(); }
      else { r = selRack(); mutate(function () { if (scope === 'all') r.shelves.forEach(function (sh) { setCells(sh, val); }); else setCells(r.shelves[+el.dataset.i], val); }); }
      break;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target.closest('[data-f]'); if (!el) return;
  var f = el.dataset.f, val = el.value, r, b, rm, p, i = +el.dataset.i, j = +el.dataset.j, v = val.trim();
  switch (f) {
    case 'space-name': mutate(function () { S.space.name = v || 'Пространство'; }); break;
    case 'space-note': mutate(function () { S.space.note = val.slice(0, 2000); }); break;
    case 'room-name': rm = selRoomObj(); mutate(function () { rm.name = v; }); break;
    case 'room-name-in': rm = curRoom(); mutate(function () { rm.name = v; }); break;
    case 'room-w': rm = selRoomObj(); mutate(function () { rm.w = Math.max(100, snapTo(toNum(val, rm.w), GRID)); }); break;
    case 'room-h': rm = selRoomObj(); mutate(function () { rm.h = Math.max(100, snapTo(toNum(val, rm.h), GRID)); }); break;
    case 'rack-label': r = selRack(); mutate(function () { r.label = (!v || v === String(r.num)) ? '' : v.slice(0, 24); }); break;
    case 'shelf-label': r = selRack(); mutate(function () { r.shelves[i].label = (!v || v === shelfDefault(r, i)) ? '' : v.slice(0, 24); }); break;
    case 'cell-name': r = selRack(); mutate(function () { r.shelves[i].names[j] = (!v || v === cellDefault(r, i, j)) ? '' : v.slice(0, 24); }); break;
    case 'box-label': b = selBox(); mutate(function () { b.label = v.slice(0, 24) || b.label; }); break;
    case 'pocket-label': p = selPocket(); mutate(function () { p.label = v.slice(0, 24) || p.label; }); break;
    case 'q-box': S.boxLabel = val; break;
    case 'q-pocket': S.pocketLabel = val; break;
  }
});
document.addEventListener('keydown', function (e) {
  var t = e.target, tag = (t.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (e.key === 'Escape') { if (modalOpen) closeModal(); else if (S.sel) { S.sel = null; render(); } return; }
  if (typing || modalOpen || S.screen === 'home') return;
  var mod = e.ctrlKey || e.metaKey, kk = e.key.toLowerCase();
  if (mod && kk === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && kk === 'y') { e.preventDefault(); redo(); return; }
  if (S.mode === 'build' && S.sel) {
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
    if (e.key === 'F2') { e.preventDefault(); var inf = S.sel.type === 'rack' ? { kind: 'rack-head', rackId: S.sel.id } : { kind: S.sel.type, id: S.sel.id }; if (S.sel.type !== 'room') startRename(inf); return; }
    var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (dir) { e.preventDefault(); var o = getObj(S.sel), g = S.sel.type === 'room' ? GRID : SNAP; mutate(function () { o.x += dir[0] * g; o.y += dir[1] * g; }); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && t.dataset && t.dataset.kind && S.mode === 'check') { e.preventDefault(); cycleUnit(readInfo(t)); }
});
$('#searchForm').addEventListener('submit', function (e) { e.preventDefault(); if (S.space) searchAddr($('#searchInp').value); });

/* ═════════════ Старт ═════════════ */
loadStore();
render();
})();
</script>
